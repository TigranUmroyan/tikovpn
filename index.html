
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SA-MP Mobile</title>
<style>
body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.container {
  max-width: 450px;
  margin: auto;
  background: #151d31;
  padding: 22px;
  border-radius: 20px;
}
h1 {
  color: #f0b84b;
  text-align: center;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  background: #0b1020;
  color: white;
  border: 1px solid #44516c;
  font-size: 17px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #f0b84b;
  font-weight: bold;
  font-size: 15px;
}
#status {
  margin-top: 15px;
  color: #f0b84b;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="container">
  <h1>SA-MP MOBILE</h1>
  <p>Подключение к серверу</p>

  <input id="ip" value="62.148.135.15"
         placeholder="IP сервера">

  <input id="port" value="7777"
         placeholder="Порт">

  <button onclick="connect()">
    ПОДКЛЮЧИТЬСЯ
  </button>

  <button onclick="copyIP()">
    СКОПИРОВАТЬ IP
  </button>

  <div id="status"></div>
</div>

<script>
function getAddress() {
  const ip = document.getElementById("ip").value.trim();
  const port = document.getElementById("port").value.trim();

  if (!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(ip) ||
      ip.split(".").some(x => Number(x) > 255) ||
      !/^\d+$/.test(port) ||
      Number(port) < 1 || Number(port) > 65535) {
    throw new Error("Проверь IP и порт!");
  }
  return ip + ":" + port;
}

function connect() {
  try {
    const address = getAddress();
    document.getElementById("status").innerText =
      "Пробуем открыть сервер " + address;

    window.location.href = "samp://" + address;
  } catch(e) {
    document.getElementById("status").innerText = e.message;
  }
}

function copyIP() {
  try {
    const address = getAddress();
    navigator.clipboard.writeText(address);
    document.getElementById("status").innerText =
      "IP скопирован: " + address;
  } catch(e) {
    document.getElementById("status").innerText = e.message;
  }
}
</script>
</body>
</html>
