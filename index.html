
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SA-MP MOBILE WEB</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10141b;color:#fff;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:600px;margin:auto}
header{text-align:center;margin:20px 0 30px}
h1{font-size:27px;color:#f5b82e;margin:0}
header p{color:#9ba6b5;font-size:13px}
.panel{
 background:#1b222d;border:1px solid #303b4b;
 border-radius:14px;padding:18px;margin-bottom:16px;
}
label{display:block;color:#aeb8c7;font-size:13px;margin:12px 0 6px}
input{
 width:100%;padding:14px;border-radius:9px;
 border:1px solid #3b4656;background:#111720;
 color:white;font-size:16px;outline:none;
}
input:focus{border-color:#f5b82e}
button{
 width:100%;padding:15px;border:0;border-radius:9px;
 background:#f5b82e;color:#171717;font-weight:bold;
 font-size:16px;margin-top:16px;
}
button:active{opacity:.8}
.status{display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:50%;background:#777}
.dot.online{background:#39d98a}
.dot.offline{background:#ff5555}
#message{color:#aeb8c7;font-size:13px;margin-top:12px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#111720;border-radius:9px;padding:13px}
.stat small{color:#9ba6b5}
.stat strong{display:block;margin-top:7px;font-size:19px;overflow-wrap:anywhere}
#players{padding-left:20px;color:#dce3ed}
footer{text-align:center;color:#657184;font-size:12px;margin:25px 0}
</style>
</head>
<body>
<div class="container">
<header>
<h1>SA-MP MOBILE WEB</h1>
<p>МОНИТОРИНГ SAN ANDREAS MULTIPLAYER</p>
</header>

<section class="panel">
<h3>Подключение к серверу</h3>

<label>Твой ник</label>
<input id="nick" maxlength="24" placeholder="Введите ник" value="Player">

<label>IP или домен сервера</label>
<input id="host" placeholder="Например: 127.0.0.1">

<label>Порт сервера</label>
<input id="port" type="number" min="1" max="65535" value="7777">

<button id="connect">ПРОВЕРИТЬ СЕРВЕР</button>
<div id="message">Ожидание проверки сервера</div>
</section>

<section class="panel">
<div class="status">
<span class="dot" id="dot"></span>
<strong id="status">Не подключено</strong>
</div>
</section>

<section class="panel">
<h3>Информация о сервере</h3>
<div class="info">
<div class="stat"><small>Игроки</small><strong id="playersCount">—</strong></div>
<div class="stat"><small>Пинг</small><strong id="ping">—</strong></div>
<div class="stat"><small>Название</small><strong id="hostname">—</strong></div>
<div class="stat"><small>Режим</small><strong id="mode">—</strong></div>
</div>
</section>

<section class="panel">
<h3>Игроки онлайн</h3>
<ul id="players"><li>Список пока пуст</li></ul>
</section>

<footer>SA-MP MOBILE WEB · Browser Server Monitor</footer>
</div>

<script>
const $ = id => document.getElementById(id);

$('connect').addEventListener('click', checkServer);

async function checkServer(){
 const host = $('host').value.trim();
 const port = Number($('port').value);
 const nick = $('nick').value.trim();

 if(!nick || !host || !Number.isInteger(port) || port < 1 || port > 65535){
   $('message').textContent = 'Проверь ник, адрес и порт сервера.';
   return;
 }

 $('connect').disabled = true;
 $('connect').textContent = 'ПРОВЕРКА...';
 $('status').textContent = 'Проверяем сервер';
 $('dot').className = 'dot';
 $('message').textContent = 'Отправляем запрос серверу...';

 try{
   const url = `/api/server?host=${encodeURIComponent(host)}&port=${port}`;
   const response = await fetch(url);
   const data = await response.json();

   if(!response.ok) throw new Error(data.error || 'Сервер недоступен');

   $('status').textContent = 'Сервер отвечает';
   $('dot').className = 'dot online';
   $('playersCount').textContent = `${data.players} / ${data.maxPlayers}`;
   $('ping').textContent = `${data.ping} ms`;
   $('hostname').textContent = data.hostname || 'Без названия';
   $('mode').textContent = data.mode || 'Неизвестно';
   $('message').textContent = 'Получен ответ от настоящего SA-MP-сервера.';

   const list = $('players');
   list.innerHTML = '';

   if(data.playerList && data.playerList.length){
     data.playerList.forEach(player => {
       const li = document.createElement('li');
       li.textContent = `${player.name} — ID ${player.id}, ${player.score} очков`;
       list.appendChild(li);
     });
   }else{
     list.innerHTML = '<li>Нет данных об игроках</li>';
   }

 }catch(error){
   $('status').textContent = 'Нет ответа от сервера';
   $('dot').className = 'dot offline';
   $('message').textContent = error.message;
   $('playersCount').textContent = '—';
   $('ping').textContent = '—';
   $('hostname').textContent = '—';
   $('mode').textContent = '—';
   $('players').innerHTML = '<li>Список недоступен</li>';
 }finally{
   $('connect').disabled = false;
   $('connect').textContent = 'ПРОВЕРИТЬ СЕРВЕР';
 }
}
</script>
</body>
</html>
